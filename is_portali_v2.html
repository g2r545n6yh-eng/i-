// ================== STATE ==================
var state = {
  savedJobs: [],
  filterLocation: 'all',
  filterSalary: 60,
  searchTerm: '',
  showSaved: false,
  applications: [],
  appliedJobIds: [],
  selectedJobId: null,
  submitting: false,
  geminiApiKey: localStorage.getItem('geminiApiKey') || ''
};

function esc(str) {
  var div = document.createElement('div');
  div.innerText = str == null ? '' : String(str);
  return div.innerHTML;
}

function getFilteredJobs() {
  var term = state.searchTerm.toLowerCase();
  var list = jobListings.filter(function(job) {
    return term === '' ||
      job.position.toLowerCase().indexOf(term) !== -1 ||
      job.company.toLowerCase().indexOf(term) !== -1;
  });
  list.sort(function(a, b) { return b.match - a.match; });
  return list;
}

function getDisplayJobs() {
  if (state.showSaved) {
    return jobListings.filter(function(j) { return state.savedJobs.indexOf(j.id) !== -1; });
  }
  return getFilteredJobs();
}

function isLogged(jobId) {
  return state.applications.some(function(a) { return a.jobId === jobId; });
}

// ================== EVENTS ==================
function onSearchChange(val) {
  state.searchTerm = val;
  renderApp();
  document.getElementById('searchInput').focus();
  var input = document.getElementById('searchInput');
  input.setSelectionRange(input.value.length, input.value.length);
}

function onLocationChange(val) {
  state.filterLocation = val;
  renderApp();
}

function onSalaryChange(val) {
  state.filterSalary = parseInt(val);
  renderApp();
}

function toggleShowSaved() {
  state.showSaved = !state.showSaved;
  renderApp();
}

function toggleSave(jobId) {
  var idx = state.savedJobs.indexOf(jobId);
  if (idx === -1) { state.savedJobs.push(jobId); }
  else { state.savedJobs.splice(idx, 1); }
  renderApp();
}

function generateCoverLetter(job) {
  return 'Merhaba,\n\n' +
    job.company + ' bünyesindeki ' + job.position + ' pozisyonu için başvurmak istiyorum.\n\n' +
    '10 yılı aşkın depo operasyonları, lojistik süreçleri ve stok yönetimi deneyimime sahibim. ' +
    'SAP ERP, Logo Tiger, Nebim V3 ve WMS sistemlerini etkin şekilde kullanıyorum. ' +
    'Arşiv Dizayn\'da Depo Sorumlusu olarak yaklaşık 9.000 farklı ürünün stok yönetimini ve envanter doğruluğunu sağlıyorum.\n\n' +
    'Deneyimlerimin ' + job.position + ' pozisyonuna değer katacağına inanıyorum. Görüşme fırsatı için teşekkür ederim.\n\n' +
    'Saygılarımla,\nBerk Ege';
}

function openApplicationModal(jobId) {
  state.selectedJobId = jobId;
  var job = jobListings.filter(function(j) { return j.id === jobId; })[0];
  renderApp();
  document.getElementById('modalPosition').innerText = job.position;
  document.getElementById('modalCompany').innerHTML = esc(job.company) + ' &bull; ' + esc(job.location);
  document.getElementById('modalCoverLetter').value = generateCoverLetter(job);
  document.getElementById('modalOverlay').style.display = 'flex';
}

function closeApplicationModal() {
  document.getElementById('modalOverlay').style.display = 'none';
  state.selectedJobId = null;
}

function viewApplicationReceiptByJob(jobId) {
  var app = state.applications.filter(function(a) { return a.jobId === jobId; })[0];
  if (!app) return;
  showReceipt(app);
}

function showReceiptById(appId) {
  var app = state.applications.filter(function(a) { return a.id === appId; })[0];
  if (!app) return;
  showReceipt(app);
}

function showReceipt(app) {
  var html = '';
  html += '<div class="bg-gray-50 rounded-lg p-4">';
  html += '<p class="font-bold text-gray-900 text-lg">' + esc(app.jobTitle || '-') + '</p>';
  html += '<p class="text-indigo-600 font-medium">' + esc(app.company || '-') + '</p>';
  html += '</div>';
  html += '<div class="grid grid-cols-2 gap-4 text-sm">';
  html += '<div><p class="text-gray-500 text-xs">Kayıt Tarihi</p><p class="font-medium">' + esc(app.appliedDate || '-') + ' ' + esc(app.appliedTime || '') + '</p></div>';
  html += '<div><p class="text-gray-500 text-xs">İşe Başlama Tarihi</p><p class="font-medium">' + esc(app.startDate || '-') + '</p></div>';
  html += '</div>';
  if (app.coverLetter) {
    html += '<div><p class="text-gray-500 text-xs mb-1">Ön Yazı Taslağı</p><div class="bg-gray-50 rounded p-3 text-sm text-gray-700 whitespace-pre-wrap">' + esc(app.coverLetter) + '</div></div>';
  }
  html += '<div class="bg-yellow-50 border border-yellow-200 rounded-lg p-3 text-xs text-yellow-800">Not: Bu kayıt sadece senin kendi takibin içindir.</div>';

  document.getElementById('receiptContent').innerHTML = html;
  document.getElementById('receiptOverlay').style.display = 'flex';
}

function closeReceiptModal() {
  document.getElementById('receiptOverlay').style.display = 'none';
}

function openSettingsModal() {
  document.getElementById('settingsOverlay').style.display = 'flex';
}

function closeSettingsModal() {
  document.getElementById('settingsOverlay').style.display = 'none';
}

function saveApiKey() {
  var key = document.getElementById('apiKeyInput').value.trim();
  state.geminiApiKey = key;
  localStorage.setItem('geminiApiKey', key);
  closeSettingsModal();
  showBanner(key ? 'AI anahtarı kaydedildi. Artık "AI ile Yeniden Yaz" kullanabilirsin.' : 'AI anahtarı temizlendi.', 'success');
}

function aiRewriteCoverLetter() {
  var job = jobListings.filter(function(j) { return j.id === state.selectedJobId; })[0];
  if (!job) return;

  if (!state.geminiApiKey) {
    document.getElementById('aiMsg').innerHTML = '<div class="bg-yellow-50 border border-yellow-200 rounded-lg p-3 text-sm text-yellow-800">Önce sağ üstteki &#9881;&#65039; AI Ayarları\'ndan ücretsiz bir Gemini API anahtarı ekle.</div>';
    return;
  }

  var btn = document.getElementById('aiRewriteBtn');
  var originalText = btn.innerText;
  btn.disabled = true;
  btn.innerText = 'Yazılıyor...';
  document.getElementById('aiMsg').innerHTML = '';

  var cvSummary = 'Berk Ege, 10 yılı aşkın depo operasyonları, lojistik süreçleri, stok yönetimi ve mağaza operasyonları deneyimine sahip. ' +
    'Şu an Arşiv Dizayn\'da Depo Sorumlusu olarak yaklaşık 9.000 farklı ürünün stok yönetimini ve envanter doğruluğunu sağlıyor. ' +
    'SAP ERP, Logo Tiger, Nebim V3 ve WMS sistemlerini etkin şekilde kullanıyor. Daha önce Securitas Alarm\'da Lojistik Uzmanı, ' +
    'Murathan Özer Telekom\'da Mağaza Müdürü olarak çalıştı. İngilizce orta seviye, B sınıfı ehliyet sahibi.';

  var prompt = 'Aşağıdaki CV özetine sahip bir adayın, belirtilen iş ilanına başvurmak için Türkçe, samimi ama profesyonel, ' +
    '150-200 kelimelik kısa bir kapı mektubu yaz. Sadece kapı mektubu metnini yaz, başka açıklama ekleme.\n\n' +
    'CV Özeti:\n' + cvSummary + '\n\n' +
    'Başvurulan Pozisyon: ' + job.position + '\n' +
    'Şirket: ' + job.company + '\n' +
    'Konum: ' + job.location;

  fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + encodeURIComponent(state.geminiApiKey), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }]
    })
  })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      btn.disabled = false;
      btn.innerText = originalText;
      var text = data && data.candidates && data.candidates[0] && data.candidates[0].content &&
        data.candidates[0].content.parts && data.candidates[0].content.parts[0] &&
        data.candidates[0].content.parts[0].text;
      if (text) {
        document.getElementById('modalCoverLetter').value = text.trim();
        document.getElementById('aiMsg').innerHTML = '<div class="bg-green-50 border border-green-200 rounded-lg p-2 text-xs text-green-800">AI ile yeniden yazıldı &#10024;</div>';
      } else {
        var errMsg = (data && data.error && data.error.message) || 'Bilinmeyen hata';
        document.getElementById('aiMsg').innerHTML = '<div class="bg-red-50 border border-red-200 rounded-lg p-2 text-xs text-red-800">Hata: ' + esc(errMsg) + '</div>';
      }
    })
    .catch(function(err) {
      btn.disabled = false;
      btn.innerText = originalText;
      document.getElementById('aiMsg').innerHTML = '<div class="bg-red-50 border border-red-200 rounded-lg p-2 text-xs text-red-800">Bağlantı hatası: ' + esc(err.message) + '</div>';
    });
}

function showBanner(message, type) {
  var banner = document.getElementById('banner');
  if (!banner) return;
  var bg = type === 'error' ? 'bg-red-50 border-red-500 text-red-800' : 'bg-green-50 border-green-500 text-green-800';
  banner.innerHTML = '<div class="mb-6 border-l-4 p-4 rounded ' + bg + '"><p class="font-medium">' + esc(message) + '</p></div>';
}

function submitApplication() {
  var job = jobListings.filter(function(j) { return j.id === state.selectedJobId; })[0];
  if (!job) return;

  var startDate = document.getElementById('modalStartDate').value;
  var coverLetter = document.getElementById('modalCoverLetter').value;
  var modalMsg = document.getElementById('modalMessage');
  modalMsg.innerHTML = '';

  var submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.innerText = 'Kaydediliyor...';

  var now = new Date();
  var appData = {
    id: Date.now(),
    jobId: job.id,
    jobTitle: job.position,
    company: job.company,
    source: job.source,
    appliedDate: now.toLocaleDateString('tr-TR'),
    appliedTime: now.toLocaleTimeString('tr-TR'),
    status: 'Kaydedildi',
    coverLetter: coverLetter,
    startDate: startDate,
    email: EMAIL
  };

  var firebaseOk = false;
  var emailOk = false;
  var pending = 2;

  function finishUp() {
    pending--;
    if (pending > 0) return;

    submitBtn.disabled = false;
    submitBtn.innerText = 'Kaydet';

    if (firebaseOk || emailOk) {
      state.applications.unshift(appData);
      closeApplicationModal();
      renderApp();
      showBanner('Kaydedildi: ' + job.company + ' - ' + job.position, 'success');
    } else {
      modalMsg.innerHTML = '<div class="bg-red-50 border border-red-200 rounded-lg p-3 text-sm text-red-700 mb-2">Kaydedilemedi. İnternet bağlantını kontrol et.</div>';
    }
  }

  fetch(FIREBASE_URL + '/applications/' + appData.id + '.json', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(appData)
  }).then(function(res) {
    firebaseOk = res.ok;
    finishUp();
  }).catch(function(err) {
    console.log('Firebase hatası:', err);
    finishUp();
  });

  fetch(FORMSPREE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({
      name: 'Berk Ege',
      email: EMAIL,
      phone: '+90 (530) 378 05 12',
      _subject: 'Başvuru Kaydı: ' + job.position + ' - ' + job.company,
      message: 'Yeni Başvuru Kaydı:\n\nPozisyon: ' + job.position + '\nŞirket: ' + job.company +
        '\nİlan Linki: ' + job.url + '\nİşe Başlama Tercihi: ' + (startDate || '-') +
        '\n\nÖn Yazı Taslağı:\n' + (coverLetter || '(Yazılmadı)')
    })
  }).then(function(res) {
    emailOk = res.ok;
    finishUp();
  }).catch(function(err) {
    console.log('Formspree hatası:', err);
    finishUp();
  });
}

function loadApplicationsFromFirebase() {
  fetch(FIREBASE_URL + '/applications.json')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data) {
        var list = Object.keys(data).map(function(key) { return data[key]; });
        state.applications = list;
        renderApp();
      }
    })
    .catch(function(err) { console.log('Firebase yükleme hatası:', err); });
}

function loadJobsFromFirebase() {
  fetch(FIREBASE_URL + '/jobs.json')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data) {
        var freshJobs = Object.keys(data).map(function(key) { return data[key]; });
        if (freshJobs.length > 0) {
          jobListings = freshJobs;
          showBanner('İlanlar güncellendi: ' + freshJobs.length + ' ilan (otomatik tarama).', 'success');
          renderApp();
        }
      }
    })
    .catch(function(err) { console.log('Firebase ilan yükleme hatası:', err); });
}

// ================== BAŞLAT ==================
renderApp();
loadApplicationsFromFirebase();
loadJobsFromFirebase();
</script>
